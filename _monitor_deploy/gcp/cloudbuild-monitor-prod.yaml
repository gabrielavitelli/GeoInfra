# Cloud Build: Monitor EFC — produção (gestores) — serviço monitor-efc-prod
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'gcp/Dockerfile.monitor'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/monitor-efc-prod'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/monitor-efc-prod']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'monitor-efc-prod'
      - '--image=gcr.io/${PROJECT_ID}/monitor-efc-prod'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--cpu-boost'
      - '--min-instances=1'
      - '--max-instances=2'
      # Suscetibilidade: raster GeoTIFF via PNG 4096px (pixels reais do corredor, como preview).
      - '--set-env-vars=USE_BQ=1,SKIP_SUSCETIBILIDADE=0,DJANGO_DEBUG=0,DJANGO_ALLOWED_HOSTS=.run.app,DJANGO_USE_HTTPS_PROXY=1,DJANGO_CSRF_TRUSTED_ORIGINS=https://*.run.app,CSRF_TRUSTED_ORIGINS=https://*.run.app,MONITOR_CANONICAL_HOST=monitor-efc-prod-zws527es5a-uc.a.run.app,HOME_BQ_WINDOW_DAYS=7,MONITOR_BQ_CACHE_TTL_SEC=600,MONITOR_MAP_CACHE_TTL=3600,MONITOR_MAP_KM_STEP=10,MONITOR_MAP_GCS_CACHE=1,MONITOR_USE_DAILY_EXCEED_TABLE=1,MONITOR_WARMUP_SECRET=efc-monitor-warmup-prod-2026,MONITOR_PREVISAO_VERIFY_CACHE_TTL=3600,PREVISAO_VERIFICATION_CACHE_FALLBACK=0,MONITOR_APP_ENV=production,MONITOR_SESSION_SIGNED_COOKIES=1,MONITOR_SEED_PORTAL_USERS=1,MONITOR_SEED_INTERNAL_DEMO=1,MONITOR_SEED_INTERNAL_USER2=demoeco1,MONITOR_SEED_INTERNAL_PASSWORD2=demoeco1,MONITOR_SEED_INTERNAL_LEVEL2=2,MONITOR_SEED_INTERNAL_VALID_UNTIL2=2026-09-10,MONITOR_SEED_INTERNAL_USER3=demovale1,MONITOR_SEED_INTERNAL_PASSWORD3=demovale1,MONITOR_SEED_INTERNAL_LEVEL3=2,MONITOR_SEED_INTERNAL_VALID_UNTIL3=2026-10-31,MONITOR_SEED_INTERNAL_USER4=demoeco2,MONITOR_SEED_INTERNAL_PASSWORD4=demoeco2,MONITOR_SEED_INTERNAL_LEVEL4=2,MONITOR_SEED_INTERNAL_VALID_DAYS4=10,MONITOR_SEED_INTERNAL_USER5=demotranspetro1,MONITOR_SEED_INTERNAL_PASSWORD5=demotranspetro1,MONITOR_SEED_INTERNAL_LEVEL5=2,MONITOR_SEED_INTERNAL_VALID_DAYS5=15,MONITOR_SEED_INTERNAL_USER6=geoinfrausp,MONITOR_SEED_INTERNAL_PASSWORD6=geoinfrausp,MONITOR_SEED_INTERNAL_LEVEL6=2,MONITOR_SEED_INTERNAL_VALID_UNTIL6=2026-09-27,MONITOR_SEED_DEMO_USER=demoeco1,MONITOR_SEED_DEMO_PASSWORD=demoeco1,MONITOR_SEED_DEMO_LEVEL=2,MONITOR_SEED_DEMO_VALID_DAYS=39,MONITOR_PORTAL_PREFIX=portal,MONITOR_ALERTS_SOURCE=raijin,SUSCETIBILIDADE_MAP_MODE=raster,SUSCETIBILIDADE_PREFER_PNG=1,SUSCETIBILIDADE_MAP_MAX_PX=4096,SUSCETIBILIDADE_MAX_PX=4096,SUSCETIBILIDADE_SKIP_CORRIDOR_MASK=1,SUSCETIBILIDADE_MAP_OPACITY=0.88,SUSCETIBILIDADE_CACHE_BUST=20260824b,MONITOR_STATIC_BUST=20261105speed1,MONITOR_MAP_CACHE_VER=folium_v56_mapfast,MONITOR_MAP_ACCUM_FAST=1,MONITOR_STATION_PANEL_TTL=1800,MONITOR_STATION_ACCUM_TTL=900,MONITOR_STATION_CATALOG_TTL=3600'
      - '--set-secrets=REDIS_URL=monitor-redis-url:latest'
      # Mount dilated PNG + bounds from gs://efc-clima-data/monitor/suscetibilidade/
      - '--add-volume=name=susc-overlay,type=cloud-storage,bucket=efc-clima-data,readonly=true,mount-options=only-dir=monitor/suscetibilidade'
      - '--add-volume-mount=volume=susc-overlay,mount-path=/app/data/geotec_geojson_fallback'
      # Patch monitor.js sem rebuild (colorbar ticks)
      - '--add-volume=name=static-js-patch,type=cloud-storage,bucket=efc-clima-data,readonly=true,mount-options=only-dir=monitor/static-patch/monitor/js'
      - '--add-volume-mount=volume=static-js-patch,mount-path=/app/staticfiles/monitor/js'

images:
  - 'gcr.io/${PROJECT_ID}/monitor-efc-prod'
